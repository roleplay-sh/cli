name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package:smoke
      # Configure npm Trusted Publishing for @roleplay-sh/cli in npm package settings.
      # This workflow intentionally does not use or require an npm token.
      # Trusted Publishing automatically creates npm provenance attestations.
      - run: pnpm publish --access public --no-git-checks
